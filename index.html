select{font:inherit;color:var(--tx);background:#2a4452;border:1px solid var(--ln);border-radius:5px;padding:4px 6px}

#w{position:relative;flex:1;min-height:0;overflow:hidden}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
canvas.tr{background:conic-gradient(#3a4a55 25%,#2b3a44 0 50%,#3a4a55 0 75%,#2b3a44 0) 0 0/16px 16px}
#ti{position:absolute;display:none;width:140px;font:700 15px "Zen Old Mincho",serif;padding:3px 6px;border:1px solid var(--ac);background:#f6f3e4;color:#222;border-radius:3px;transform:translate(-50%,-50%)}

function mtn2(i){const p=i.p[0],x=X(p),y=Y(p),w=9*i.s*V.z*(.85+.3*rn(p[0],p[1],8)),r=n=>rn(p[0],p[1],n),h=w*(1.1+.6*r(1)),a=x+(r(2)-.5)*w*.5,b=a+w*(.1+.3*(r(10)-.5)),P=[a,y-h],BL=[x-w,y],BR=[x+w,y],RF=[b,y],M=[a+(b-a)*.5+(r(11)-.5)*w*.15,y-h*.5],

 I.flatMap(i=>i.k=='n'?ridge(i):[i]).filter(i=>(i.k=='m'||i.k=='f')&&!off(i.p[0])).sort((a,b)=>a.p[0][1]-b.p[0][1]).forEach(i=>{

function paintOp(o){

 if(o.t!=null){cx.font=`700 ${o.fs}px ${FONT}`;cx.textAlign='center';cx.textBaseline='middle';cx.lineWidth=4;cx.strokeStyle=o.h;cx.strokeText(o.t,o.x,o.y);cx.fillStyle=o.c;cx.fillText(o.t,o.x,o.y);return}
